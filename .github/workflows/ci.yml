name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  android:
    runs-on: ubuntu-latest
    env:
      # google-services.json no se versiona: cargalo en Settings > Secrets como base64
      # (base64 -w0 app/google-services.json). Sin el secreto, el job se saltea.
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Escribir google-services.json
        if: env.GOOGLE_SERVICES_JSON_B64 != ''
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
      - name: Tests unitarios y build debug
        if: env.GOOGLE_SERVICES_JSON_B64 != ''
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Aviso
        if: env.GOOGLE_SERVICES_JSON_B64 == ''
        run: echo "::warning::Falta el secreto GOOGLE_SERVICES_JSON_B64; se saltea el build de Android."
